[package]
name = "svarog-secp256k1"
version = "0.1.1"
edition = "2024"
description = "secp256k1 arithmetic with support for the identity point."
repository.workspace = true
license.workspace = true
readme = "README.md"

[dependencies]
rand = "0.9.2"
rug = { version = "1.28.1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }

curve-abstract = { path = "../curve-abstract", version = "0.1.1" }
secp256k1-sys = { package = "svarog-secp256k1-sys", path = "../secp256k1-sys", version = "0.1.1" }
