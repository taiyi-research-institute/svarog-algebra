[package]
edition = "2021"
rust-version = "1.63.0"
name = "svarog-secp256k1-sys"
version = "0.1.0"
authors = [
    "Dawid Ciężarkiewicz <dpc@ucore.info>",
    "Andrew Poelstra <apoelstra@wpsoftware.net>",
    "Steven Roose <steven@stevenroose.org>",
]
build = "build.rs"
links = "svarog_secp256k1_v0_1"
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Svarog fork of secp256k1-sys with internal group, scalar, and field operations."
homepage = "https://github.com/taiyi-research-institute/svarog-algebra"
documentation = "https://docs.rs/svarog-secp256k1-sys/"
readme = "README.md"
keywords = [
    "secp256k1",
    "libsecp256k1",
    "ffi",
]
license = "CC0-1.0"
repository.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [
    "--cfg",
    "docsrs",
]

[features]
alloc = []
default = ["std"]
lowmemory = []
recovery = []
std = ["alloc"]

[lib]
name = "svarog_secp256k1_sys"
path = "src/lib.rs"

[dev-dependencies.libc]
version = "0.2"

[build-dependencies.cc]
version = "1.0.28"

[lints.clippy]
indexing_slicing = "allow"
large_enum_variant = "allow"
match_bool = "allow"
match_same_arms = "allow"
must_use_candidate = "allow"
similar_names = "allow"
uninlined_format_args = "allow"

[lints.rust.unexpected_cfgs]
level = "deny"
priority = 0
check-cfg = [
    "cfg(bench)",
    "cfg(secp256k1_fuzz)",
    "cfg(rust_secp_no_symbol_renaming)",
]

[dev-dependencies.upstream-secp256k1-sys]
package = "secp256k1-sys"
version = "=0.13.0"

[[test]]
name = "coexistence"
path = "tests/coexistence.rs"
required-features = ["alloc"]
